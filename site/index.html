<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>YEKKI 공모 레이더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: a workshop pinboard — sticky filter rail on wide screens, list of call slips with a D-day stamp on the left; calendar tab for calls you committed to. */
:root{
  --bg:#eef0ec; --surface:#fafbf8; --sunk:#e3e6e0; --line:#cfd4cb;
  --fg:#1d221f; --muted:#5d665f; --accent:#2346c8; --accent-ink:#ffffff; --accent-soft:#dfe5fb;
  --hot:#c2410c; --hot-soft:#fbe5d8; --warn:#a16207; --warn-soft:#f6ebc9; --ok:#15803d; --ok-soft:#d9f0df;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1c201d; --sunk:#252a26; --line:#353b36;
  --fg:#e8ece7; --muted:#9aa49c; --accent:#8ea4ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --hot:#fb8a55; --hot-soft:#3a2216; --warn:#e3b341; --warn-soft:#352c14; --ok:#5fd087; --ok-soft:#173022; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1c201d; --sunk:#252a26; --line:#353b36;
  --fg:#e8ece7; --muted:#9aa49c; --accent:#8ea4ff; --accent-ink:#0d1330; --accent-soft:#232c52;
  --hot:#fb8a55; --hot-soft:#3a2216; --warn:#e3b341; --warn-soft:#352c14; --ok:#5fd087; --ok-soft:#173022; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.brand h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:2px 0 0;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left}
.stat b{font-family:var(--font-mono);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.stat.hot b{color:var(--hot)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.filters{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){aside.filters{position:static}}
.fgroup{display:flex;flex-direction:column;gap:6px}
.fgroup>label,.fgroup>.lbl{font-size:11px;font-weight:600;letter-spacing:.06em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=search],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer}
.reset{align-self:flex-start;border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:12.5px;text-decoration:underline}
.listhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.list{display:flex;flex-direction:column;gap:10px}
.slip{display:grid;grid-template-columns:76px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.slip.passed{opacity:.55}
.stamp{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;background:var(--sunk);border-right:1px dashed var(--line);text-align:center}
.stamp b{font-family:var(--font-mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.stamp small{font-size:11px;color:var(--muted);font-family:var(--font-mono)}
.stamp.u1{background:var(--hot-soft)}.stamp.u1 b{color:var(--hot)}
.stamp.u2{background:var(--warn-soft)}.stamp.u2 b{color:var(--warn)}
.stamp.closed b{color:var(--muted)}
.body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meta1{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.tag{font-size:11.5px;padding:1px 8px;border-radius:5px;background:var(--sunk);color:var(--muted);font-weight:500}
.tag.cat{background:var(--accent-soft);color:var(--accent)}
.tag.new{background:var(--ok-soft);color:var(--ok);font-weight:700}
.tag.fit{border:1px solid var(--line);background:transparent;color:var(--fg)}
.slip h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.4;text-wrap:balance}
.slip h3 a{text-decoration:none}.slip h3 a:hover{text-decoration:underline}
.org{color:var(--muted);font-size:13px}
.sum{margin:0;font-size:13.5px;max-width:68ch}
.facts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.facts span b{color:var(--fg);font-weight:500}
.actions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:12.5px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.5;cursor:default}
.applybox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:12.5px}
.applybox input{width:64px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--font-mono)}
.stsel{width:auto;padding:4px 8px;font-size:12.5px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);margin-bottom:4px;font-size:15px}
.notice{font-size:12.5px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 12px}
/* calendar */
.cal{display:flex;flex-direction:column;gap:14px}
.calbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.calbar h2{margin:0;font-size:18px;font-family:var(--font-mono);font-weight:600;min-width:120px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);margin-left:auto;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.gridwrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--line);gap:1px;min-width:560px}
.dow{background:var(--sunk);font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0}
.day{background:var(--surface);min-height:92px;padding:5px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day.out{background:var(--bg)}.day.out .dn{opacity:.4}
.dn{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.day.today .dn{color:var(--accent-ink);background:var(--accent);border-radius:4px;padding:0 5px;align-self:flex-start}
.ev{font-size:11px;line-height:1.3;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.dl{background:var(--hot);color:var(--surface);font-weight:600}
.ev.prep{background:var(--accent-soft);color:var(--accent)}
.ev.ann{background:var(--ok-soft);color:var(--ok)}
.agenda{display:flex;flex-direction:column;gap:8px}
.agenda h3{margin:6px 0 0;font-size:14px}
.arow{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.arow .d{font-family:var(--font-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.arow .t{min-width:0}.arow .t b{display:block;font-weight:600;overflow-wrap:anywhere}.arow .t small{color:var(--muted)}
@media (max-width:560px){.arow{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.tag.chk{background:var(--warn-soft);color:var(--warn);font-weight:600}
.health{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}
.health summary{cursor:pointer;font-weight:600}
.health table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.health td,.health th{padding:5px 6px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
.health .bad{color:var(--hot);font-weight:600}.health .okc{color:var(--ok)}
.hwrap{overflow-x:auto}
.foot{color:var(--muted);font-size:12px}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>YEKKI 공모 레이더</h1>
      <p id="updated">공고 목록을 불러오는 중입니다.</p>
    </div>
    <div class="tabs" role="tablist">
      <button id="tab-art" role="tab" aria-selected="true">작가·공모전</button>
      <button id="tab-life" role="tab" aria-selected="false">생활 지원</button>
      <button id="tab-cal" role="tab" aria-selected="false">내 지원 달력</button>
    </div>
  </header>

  <div id="dbnote" class="notice" hidden></div>

  <section class="stats" id="stats" aria-label="요약">
    <button class="stat" id="st-open"><b>0</b><span>접수 중</span></button>
    <button class="stat hot" id="st-week"><b>0</b><span>7일 안에 마감</span></button>
    <button class="stat" id="st-new"><b>0</b><span>최근 3일 새 공고</span></button>
    <button class="stat" id="st-mine"><b>0</b><span>내가 지원 중</span></button>
  </section>

  <main id="view-list" class="layout">
    <aside class="filters" aria-label="필터">
      <div class="fgroup"><label for="q">검색</label><input id="q" type="search" placeholder="제목, 기관, 키워드"></div>
      <div class="fgroup"><span class="lbl">분야</span><div class="chips" id="f-cat"></div></div>
      <div class="fgroup"><label for="f-region">지역</label><select id="f-region"><option value="">전체 지역</option></select></div>
      <div class="fgroup"><label for="f-due">마감</label>
        <select id="f-due"><option value="">전체</option><option value="7">7일 안</option><option value="14">2주 안</option><option value="31">한 달 안</option></select></div>
      <div class="fgroup"><span class="lbl">지원 형태</span><div class="chips" id="f-sup"></div></div>
      <div class="fgroup" id="fg-fit"><span class="lbl">나와의 적합도</span><div class="chips" id="f-fit"></div></div>
      <div class="fgroup"><span class="lbl">자격·상태</span>
        <label class="check" id="lb-indiv"><input type="checkbox" id="f-indiv"> 개인 작가 지원 가능만</label>
        <label class="check"><input type="checkbox" id="f-noage"> 연령 제한 없는 것만</label>
        <label class="check"><input type="checkbox" id="f-star"> 관심 표시한 것만</label>
        <label class="check"><input type="checkbox" id="f-hidepass" checked> 패스한 공고 숨기기</label>
        <label class="check"><input type="checkbox" id="f-hideclosed" checked> 마감 지난 공고 숨기기</label>
        <label class="check"><input type="checkbox" id="f-verified"> 확인 필요 표시 없는 것만</label>
      </div>
      <button class="reset" id="reset">필터 초기화</button>
    </aside>
    <section style="display:flex;flex-direction:column;gap:10px;min-width:0">
      <div class="listhead"><span id="count">0건</span>
        <select id="sort" class="stsel" aria-label="정렬"><option value="due">마감 임박순</option><option value="new">새로 들어온 순</option></select></div>
      <div class="list" id="list"></div>
    </section>
  </main>

  <main id="view-cal" class="cal" hidden>
    <div class="calbar">
      <button class="btn" id="prev" aria-label="이전 달">‹</button>
      <h2 id="month"></h2>
      <button class="btn" id="next" aria-label="다음 달">›</button>
      <button class="btn" id="thismonth">이번 달</button>
      <div class="legend"><span><i style="background:var(--accent-soft)"></i>준비 시작</span><span><i style="background:var(--hot)"></i>마감</span><span><i style="background:var(--ok-soft)"></i>결과 발표</span></div>
    </div>
    <div class="gridwrap"><div class="grid" id="grid"></div></div>
    <div class="agenda" id="agenda"></div>
  </main>
  <details class="health" id="health"><summary>수집 상태</summary><div id="healthbody">불러오는 중</div></details>
  <p class="foot">관심·지원 상태는 이 브라우저에만 저장됩니다. 다른 사람은 볼 수 없고, 휴대폰과 컴퓨터 사이에는 공유되지 않습니다.</p>
</div>

<script>
const ART_CATS={goods:"굿즈·기념품",art:"예술·전시 지원",design:"디자인 공모",startup:"창업 지원",overseas:"해외 공모전",residency:"레지던시",local:"지자체 사업"};
const LIFE_CATS={youth:"청년 지원",housing:"주거",welfare:"생활·복지"};
const CATS={...ART_CATS,...LIFE_CATS};
const ART_SUPS={prize:"상금",fund:"제작·사업비",exhibit:"전시 기회",space:"공간·체류",commercial:"상품화·납품"};
const LIFE_SUPS={rent:"주거·임대",cash:"수당·현금",loan:"대출·이자",service:"서비스·바우처"};
const SUPS={...ART_SUPS,...LIFE_SUPS};
const boardOf=c=>c.board==="life"?"life":"art";
const FITS={pixel:"Pixel Studio",yekki:"YEKKI 작업"};
const STATES={applying:"준비 중",submitted:"제출 완료",waiting:"결과 대기",selected:"선정",rejected:"미선정"};
const KEY="gongmo-radar-marks-v1";
const S={calls:[],marks:{},meta:null,health:null,cat:new Set(),sup:new Set(),fit:new Set(),openApply:null,tab:"art",month:null};
const inBoard=()=>S.calls.filter(c=>boardOf(c)===(S.tab==="life"?"life":"art"));
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayStr=()=>fmt(new Date());
const parse=s=>{if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const daysLeft=s=>{const d=parse(s);if(!d)return null;return Math.round((d-parse(todayStr()))/864e5)};
const short=s=>{const d=parse(s);return d?(d.getMonth()+1)+"."+d.getDate():"미정"};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return fmt(d)};
const mark=id=>S.marks[id]||{};
const isNew=c=>c.foundAt&&daysLeft(c.foundAt)>=-3;
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#";

function loadMarks(){try{S.marks=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){S.marks={}}}
function saveMarks(){try{localStorage.setItem(KEY,JSON.stringify(S.marks))}catch(e){
  $("dbnote").textContent="이 브라우저에서는 선택 내용을 저장할 수 없습니다(사생활 보호 모드 등). 새로고침하면 사라집니다.";$("dbnote").hidden=false}}
function setMark(id,data){if(data)S.marks[id]={...data,updatedAt:new Date().toISOString()};else delete S.marks[id];saveMarks();render()}

function chips(el,map,set){el.innerHTML=Object.entries(map).map(([k,v])=>`<button class="chip" data-k="${k}" aria-pressed="${set.has(k)}">${v}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;const k=b.dataset.k;set.has(k)?set.delete(k):set.add(k);b.setAttribute("aria-pressed",set.has(k));render()}}
function boardChips(){const life=S.tab==="life";chips($("f-cat"),life?LIFE_CATS:ART_CATS,S.cat);chips($("f-sup"),life?LIFE_SUPS:ART_SUPS,S.sup);
  chips($("f-fit"),FITS,S.fit);$("fg-fit").hidden=life;$("lb-indiv").hidden=life}
boardChips();
["q","f-region","f-due","f-indiv","f-noage","f-star","f-hidepass","f-hideclosed","f-verified","sort"].forEach(id=>$(id).addEventListener("input",render));
$("reset").onclick=()=>{S.cat.clear();S.sup.clear();S.fit.clear();$("q").value="";$("f-region").value="";$("f-due").value="";
  ["f-indiv","f-noage","f-star","f-verified"].forEach(i=>$(i).checked=false);$("f-hidepass").checked=true;$("f-hideclosed").checked=true;
  boardChips();render()};

function filtered(){
  const q=$("q").value.trim().toLowerCase(),reg=$("f-region").value,due=+$("f-due").value||0;
  const out=inBoard().filter(c=>{
    const m=mark(c.id),dl=daysLeft(c.deadline);
    if($("f-hideclosed").checked&&dl!==null&&dl<0&&!STATES[m.state])return false;
    if($("f-hidepass").checked&&m.state==="pass")return false;
    if($("f-star").checked&&m.state!=="star")return false;
    if($("f-verified").checked&&c.needsCheck)return false;
    if(q&&!(c.title+" "+c.org+" "+(c.summary||"")+" "+(c.eligibility||"")).toLowerCase().includes(q))return false;
    if(S.cat.size&&!(c.cats||[]).some(k=>S.cat.has(k)))return false;
    if(S.sup.size&&!(c.support||[]).some(k=>S.sup.has(k)))return false;
    if(S.fit.size&&!(c.fit||[]).some(k=>S.fit.has(k)))return false;
    if(reg&&c.region!==reg)return false;
    if(due&&(dl===null||dl<0||dl>due))return false;
    if($("f-indiv").checked&&c.individualOk===false)return false;
    if($("f-noage").checked&&c.ageLimit)return false;
    return true});
  const rank=c=>{const d=daysLeft(c.deadline);return d===null?9999:d<0?99999:d};
  out.sort($("sort").value==="new"?(a,b)=>String(b.foundAt||"").localeCompare(String(a.foundAt||""))||rank(a)-rank(b):(a,b)=>rank(a)-rank(b));
  return out}

function stamp(c){const dl=daysLeft(c.deadline);
  if(dl===null)return `<div class="stamp"><b>?</b><small>마감 확인</small></div>`;
  if(dl<0)return `<div class="stamp closed"><b>마감</b><small>${short(c.deadline)}</small></div>`;
  const u=dl<=7?"u1":dl<=14?"u2":"";
  return `<div class="stamp ${u}"><b>${dl===0?"D-DAY":"D-"+dl}</b><small>${short(c.deadline)}</small></div>`}

function stateSelect(c,m){return `<select class="stsel" data-act="state" data-id="${esc(c.id)}" aria-label="지원 상태">${Object.entries(STATES).map(([k,v])=>`<option value="${k}" ${m.state===k?"selected":""}>${v}</option>`).join("")}</select>`}

function slip(c){const m=mark(c.id),dl=daysLeft(c.deadline),applied=!!STATES[m.state],id=esc(c.id);
  const period=(c.startDate?short(c.startDate)+" ~ ":"")+(c.deadline?short(c.deadline)+(c.deadlineNote?" "+c.deadlineNote:""):"공고 확인");
  let act;
  if(applied)act=`<span class="tag cat">지원 관리 중</span>${stateSelect(c,m)}<button class="btn" data-act="unapply" data-id="${id}">지원 취소</button>`;
  else if(S.openApply===c.id)act=`<div class="applybox"><label for="pd-${id}">마감</label><input id="pd-${id}" type="number" min="0" max="120" value="${m.prepDays||14}"><span>일 전부터 준비</span>
      <button class="btn primary" data-act="confirm" data-id="${id}">달력에 넣기</button><button class="btn" data-act="cancel">취소</button></div>`;
  else act=`<button class="btn primary" data-act="apply" data-id="${id}" ${dl!==null&&dl<0?"disabled":""}>지원하기</button>
    <button class="btn ${m.state==="star"?"on":""}" data-act="star" data-id="${id}">${m.state==="star"?"★ 관심":"☆ 관심"}</button>
    <button class="btn" data-act="pass" data-id="${id}">${m.state==="pass"?"패스 취소":"패스"}</button>`;
  const chk=c.needsCheck?`<span class="tag chk" title="${esc((c.checkReasons||[]).join(", "))}">확인 필요</span>`:"";
  return `<article class="slip ${dl!==null&&dl<0?"passed":""}">${stamp(c)}<div class="body">
    <div class="meta1">${isNew(c)?'<span class="tag new">NEW</span>':""}${chk}${(c.cats||[]).map(k=>`<span class="tag cat">${CATS[k]||esc(k)}</span>`).join("")}<span class="tag">${esc(c.region||"전국")}</span>${(c.fit||[]).map(k=>`<span class="tag fit">${FITS[k]||esc(k)}</span>`).join("")}</div>
    <h3><a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${esc(c.title)}</a></h3>
    <div class="org">${esc(c.org)}${(c.sources||[]).length?" · 출처 "+esc(c.sources.join(", ")):""}</div>
    ${c.summary?`<p class="sum">${esc(c.summary)}</p>`:""}
    <div class="facts"><span>접수 <b>${esc(period)}</b></span>${c.announceDate?`<span>발표 <b>${short(c.announceDate)}</b></span>`:""}
      ${(c.support||[]).length?`<span>지원 <b>${c.support.map(k=>SUPS[k]||esc(k)).join(", ")}${c.supportAmount?" · "+esc(c.supportAmount):""}</b></span>`:""}
      ${c.eligibility?`<span>자격 <b>${esc(c.eligibility)}</b></span>`:""}${c.ageLimit?`<span>연령 <b>${esc(c.ageLimit)}</b></span>`:""}</div>
    <div class="actions">${act}</div></div></article>`}

function render(){
  const B=inBoard(),open=B.filter(c=>{const d=daysLeft(c.deadline);return d===null||d>=0});
  $("st-open").querySelector("b").textContent=open.length;
  $("st-week").querySelector("b").textContent=open.filter(c=>{const d=daysLeft(c.deadline);return d!==null&&d<=7}).length;
  $("st-new").querySelector("b").textContent=B.filter(isNew).length;
  $("st-mine").querySelector("b").textContent=S.calls.filter(c=>STATES[mark(c.id).state]).length;
  const regs=[...new Set(B.map(c=>c.region||"전국"))].sort();const rs=$("f-region"),cur=rs.value;
  rs.innerHTML='<option value="">전체 지역</option>'+regs.map(r=>`<option ${r===cur?"selected":""}>${esc(r)}</option>`).join("");
  const list=filtered();$("count").textContent=list.length+"건 표시 · 이 게시판 전체 "+B.length+"건";
  $("list").innerHTML=list.length?list.map(slip).join(""):(B.length?`<div class="empty"><b>조건에 맞는 공고가 없습니다</b>필터를 줄이거나 초기화해 보세요.</div>`:
    S.tab==="life"?`<div class="empty"><b>아직 생활 지원 공고가 없습니다</b>청년·주거·생활 지원 공고는 수집처를 연결하는 대로 여기에 쌓입니다.</div>`:
    `<div class="empty"><b>아직 들어온 공고가 없습니다</b>매일 아침 자동 수집이 돌면 여기에 마감 임박순으로 쌓입니다.</div>`);
  $("updated").textContent=S.meta?"마지막 자동 업데이트 "+S.meta:"공모·지원사업과 생활 지원 공고를 매일 모아 둡니다.";
  if(S.tab==="cal")renderCal()}

document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.tagName==="SELECT")return;const id=b.dataset.id,m=mark(id);
  switch(b.dataset.act){
    case "apply":S.openApply=id;render();break;
    case "cancel":S.openApply=null;render();break;
    case "confirm":{const n=Math.max(0,Math.min(120,+$("pd-"+id).value||0));S.openApply=null;setMark(id,{state:"applying",prepDays:n});break}
    case "star":setMark(id,m.state==="star"?null:{state:"star"});break;
    case "pass":setMark(id,m.state==="pass"?null:{state:"pass"});break;
    case "unapply":setMark(id,null);break}});
document.addEventListener("change",e=>{const s=e.target.closest('select[data-act="state"]');if(!s)return;const m=mark(s.dataset.id);
  setMark(s.dataset.id,{state:s.value,prepDays:m.prepDays??14})});

let listTab="art";
function tab(t){const was=S.tab;S.tab=t;["art","life","cal"].forEach(k=>$("tab-"+k).setAttribute("aria-selected",t===k));
  $("view-list").hidden=t==="cal";$("view-cal").hidden=t!=="cal";$("stats").hidden=t==="cal";
  if(t!=="cal"){listTab=t;if(was!==t){S.cat.clear();S.sup.clear();S.fit.clear();boardChips()}render()}else renderCal();
  try{localStorage.setItem("gongmo-radar-tab",t)}catch(e){}}
$("tab-art").onclick=()=>tab("art");$("tab-life").onclick=()=>tab("life");$("tab-cal").onclick=()=>tab("cal");
$("st-week").onclick=()=>{$("f-due").value="7";render()};
$("st-new").onclick=()=>{$("sort").value="new";render()};
$("st-open").onclick=()=>$("reset").click();
$("st-mine").onclick=()=>tab("cal");

function events(){const ev=[];
  S.calls.forEach(c=>{const m=mark(c.id);if(!STATES[m.state])return;
    if(c.deadline){ev.push({date:c.deadline,kind:"dl",c});const p=m.prepDays??14;if(p>0)ev.push({date:addDays(c.deadline,-p),kind:"prep",c})}
    if(c.announceDate)ev.push({date:c.announceDate,kind:"ann",c})});return ev}
function renderCal(){
  if(!S.month){const t=new Date();S.month=new Date(t.getFullYear(),t.getMonth(),1)}
  const y=S.month.getFullYear(),mo=S.month.getMonth();$("month").textContent=y+". "+String(mo+1).padStart(2,"0");
  const byDate={};events().forEach(e=>(byDate[e.date]=byDate[e.date]||[]).push(e));
  const start=new Date(y,mo,1);start.setDate(1-start.getDay());const td=todayStr(),lab={dl:"마감",prep:"준비",ann:"발표"};
  let h=["일","월","화","수","목","금","토"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=fmt(d);
    if(i===35&&d.getMonth()!==mo)break;
    h+=`<div class="day ${d.getMonth()!==mo?"out":""} ${ds===td?"today":""}"><span class="dn">${d.getDate()}</span>${(byDate[ds]||[]).map(e=>`<div class="ev ${e.kind}" title="${esc(e.c.title)}">${lab[e.kind]} · ${esc(e.c.title)}</div>`).join("")}</div>`}
  $("grid").innerHTML=h;
  const mine=S.calls.filter(c=>STATES[mark(c.id).state]).sort((a,b)=>String(a.deadline||"9").localeCompare(String(b.deadline||"9")));
  $("agenda").innerHTML=`<h3>지원 목록</h3>`+(mine.length?mine.map(c=>{const m=mark(c.id),dl=daysLeft(c.deadline),p=m.prepDays??14;
    return `<div class="arow"><div class="d">${c.deadline?short(c.deadline)+" 마감<br>"+(dl>=0?"D-"+dl:"마감됨"):"마감 미정"}</div>
      <div class="t"><b><a href="${esc(safeUrl(c.url))}" target="_blank" rel="noopener">${esc(c.title)}</a></b><small>${boardOf(c)==="life"?"생활 · ":""}${c.deadline&&p>0?"준비 시작 "+short(addDays(c.deadline,-p)):""}${c.announceDate?" · 발표 "+short(c.announceDate):""}</small></div>
      ${stateSelect(c,m)}</div>`}).join(""):
    `<div class="empty"><b>달력에 들어간 공고가 없습니다</b>공고 목록에서 ‘지원하기’를 누르면 준비 시작일·마감일·발표일이 여기 표시됩니다.</div>`)}
$("prev").onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1);renderCal()};
$("next").onclick=()=>{S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1);renderCal()};
$("thismonth").onclick=()=>{S.month=null;renderCal()};

function renderHealth(){const h=S.health,el=$("healthbody");if(!h){el.textContent="아직 수집 기록이 없습니다.";return}
  const label={ok:"정상",empty:"0건",error:"실패",robots:"수집 금지",skipped:"건너뜀"};
  const bad=(h.sources||[]).filter(s=>s.status!=="ok").length,c=h.counts||{},ai=h.ai||{};
  $("health").querySelector("summary").textContent=`수집 상태 · ${h.runAt} · 소스 ${(h.sources||[]).length}곳 중 문제 ${bad}곳`;
  el.innerHTML=`<p>새 공고 ${c.new||0}건, 갱신 ${c.updated||0}건, 관련 없음 ${c.skipped||0}건, 읽기 실패 ${c.read_failed||0}건${c.over_limit?`, 하루 한도 초과로 내일로 미룬 글 ${c.over_limit}건`:""}.
    ${ai.mode==="subscription"?`AI는 Claude 구독으로 실행 (API로 환산하면 약 $${(ai.cli_cost_usd||0).toFixed(3)})`:`AI 사용 약 $${(ai.est_cost_usd||0).toFixed(3)}`}, 검색 ${ai.searches||0}회.</p>
    <div class="hwrap"><table><thead><tr><th>소스</th><th>상태</th><th>링크</th><th>새 글</th><th>메모</th></tr></thead><tbody>
    ${(h.sources||[]).map(s=>`<tr><td><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a></td><td class="${s.status==="ok"?"okc":"bad"}">${label[s.status]||esc(s.status)}</td><td>${s.links}</td><td>${s.new}</td><td>${esc(s.detail||"")}</td></tr>`).join("")}
    ${(h.discovery||[]).map(d=>`<tr><td>웹 검색 · ${esc(d.id)}</td><td class="okc">정상</td><td>${d.found}</td><td>${d.new}</td><td></td></tr>`).join("")}
    </tbody></table></div>${(h.read_errors||[]).length?`<p>열지 못한 글: ${h.read_errors.map(esc).join("<br>")}</p>`:""}`}

loadMarks();render();
Promise.all([fetch("data/calls.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null),
  fetch("data/health.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null)]).then(([calls,health])=>{
  if(calls){S.calls=calls.calls||[];S.meta=calls.updatedAt||null}
  else{$("dbnote").textContent="공고 데이터를 불러오지 못했습니다. 첫 자동 수집이 끝나면 표시됩니다.";$("dbnote").hidden=false}
  S.health=health;renderHealth();render()});
try{const t=localStorage.getItem("gongmo-radar-tab");if(t==="life"||t==="cal")tab(t)}catch(e){}
</script>
</body>
</html>
