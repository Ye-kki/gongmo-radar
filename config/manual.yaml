urls:
  - url: https://www.bcf.or.kr/base/board/read?boardManagementNo=25&boardNo=153237&searchCategory=&page=1&searchType=&searchWord=&menuLevel=2&menuNo=86
    text: |
      [부천문화재단] 2026 부천문화재단×크라이치즈버거 예술상품 개발 공모전
      부천 크라이치즈버거와 협업해 버거를 주제로 한 작품·굿즈를 만들 작가 모집. 선정되면 크라이치즈버거 신중동점에서 시범 판매.
      지원: 창작지원금 1인당 100만원, 신중동점 시범 판매(12/1~12/21), 홍보
      부문: 작품 부문 2명(숍인숍 참여작가만), 굿즈 부문 1명
      대상: 사업자등록을 마친 개인 또는 법인 (소재지 대한민국). 사업자등록증은 공고일(10/16) 이후 발급본.
      요건: 개당 2만원 이내(부가세 포함), 3면의 합 30cm 이내, 1인(업체)당 3작품 이내
      접수: 2026.10.23(금) ~ 2026.11.3(화) 18:00, 이메일 접수 (방문·우편 불가)

  - url: https://arthub.co.kr/sub04/board01_view.htm?No=27355&sType1=1&sType2=2&sType3=3
    text: |
      아트센터예술의시간 <아티스트 프롤로그 2027> 작가 공모
      주관: 아트센터예술의시간 (서울시 금천구 범안로9길 23), 홈페이지 https://artmoment.org
      2027년 연례전시에 참여할 작가 2인(팀) 선정, 2027년 4월~8월 순차 개인전(약 6주, 4층 전시실 82㎡).
      모집대상: 현대미술 전 영역 작가, 대한민국 국적, 개인전 3회 이하, 개인 또는 팀. 학부 재학생 지원 불가.
      선정혜택: 전시 지원금 개인(팀)당 300만원, 전시 기획 멘토링, 홍보, 홍보물 제작, 전경 촬영, 비평글, 작품 보험. 운송·설치는 작가 부담.
      접수 기간: 2026년 11월 16일(월) ~ 11월 22일(일) 23:59
      제출: 동의서 + 포트폴리오·기획안을 PDF 1부(20MB 미만)로 이메일 artmoment.doksan@gmail.com, 제목 AP2027_성함
      결과발표: 12월 넷째 주 예정

  - url: https://www.gdfac.or.kr/community/ko/notice/102403
    text: |
      [강동문화재단] 2026 강동문화재단 GAC Creative Bridge 아트 굿즈 창작지원 프로젝트 공모
      강동의 문화·자연·예술 이야기를 담은 아트 굿즈를 만들 창작자 15명(팀) 모집.
      지원: 창작지원금 100만원, 전문업체 협업(멘토링), 시제품 제작, 촬영 지원, 선정작 전시
      대상: 국내 창작자 누구나 (개인 또는 2인 이하 팀), 1인(팀)당 최대 3작품
      분야: 생활소품·공예품·문구·사무용품·패션·액세서리 등 (식품·음반·출판물 제외)
      접수: 2026.10.16(금) ~ 2026.10.30(금) 24:00, 이메일 접수
      선정자 발표: 11/6 이후
      심사 기준: 지역성 40, 상품성 30, 실용성 20, 창의성 10. 강동 거주·근무·사업장 가산점.
