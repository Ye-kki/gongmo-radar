# 매일 확인할 게시판 목록
#
# 항목 설명
#   id        짧은 영문 이름 (중복 불가)
#   name      표시 이름
#   url       공고 '목록' 페이지 주소
#   cats      이 소스의 기본 분야 (goods, art, design, startup, overseas, residency, local)
#   region    기본 지역 (전국, 서울, 부산 ..., 해외)
#   filter    true면 제목에 아래 title_keywords 중 하나가 있어야 후보로 봄
#             (공지사항처럼 잡다한 글이 섞인 게시판에 사용)
#   link_regex   (선택) 상세 링크 주소가 맞아야 하는 정규식. 메뉴 링크를 거를 때 사용
#   onclick      (선택) 상세 링크가 javascript 함수로 되어 있을 때
#                  regex: onclick/href 안에서 글 번호를 뽑는 정규식 (그룹 1개)
#                  template: 글 번호를 넣어 만들 상세 주소, {id} 자리에 들어감
#   enabled   false면 건너뜀
#
# 처음 넣은 주소 중 일부는 사이트 구조를 직접 확인하지 못했습니다.
# 매일 실행 후 페이지 아래 '수집 상태'에 실패나 0건으로 뜨는 소스는 주소나 link_regex를 고치면 됩니다.

title_keywords: [공모, 모집, 지원, 굿즈, 기념품, 캐릭터, 마스코트, 디자인, 공예, 가구, 조명,
  작가, 전시, 입주, 레지던시, 창작, 예술, 창업, 사업화, 청년, 시제품, 상품화, 3D, 피규어,
  아트, 페어, 어워드, 콘테스트, competition, award, open call, residency]

sources:
  # ── 공모전 모음 ───────────────────────────────
  - id: contestkorea-design
    name: 콘테스트코리아 미술·디자인
    url: https://www.contestkorea.com/sub/list.php?int_gbn=1&Txt_bcode=030610001
    cats: [goods, design]
    region: 전국
    filter: false
    link_regex: 'view\.php\?.*str_no='

  - id: wevity-design
    name: 위비티 디자인·캐릭터
    url: https://www.wevity.com/?c=find&s=1&gub=1&cidx=19
    cats: [goods, design]
    region: 전국
    filter: false
    link_regex: 'gbn=view.*ix=\d+'

  - id: wevity-art
    name: 위비티 예체능·미술
    url: https://www.wevity.com/?c=find&s=1&gub=1&cidx=20
    cats: [art]
    region: 전국
    filter: true
    link_regex: 'gbn=view.*ix=\d+'

  - id: artculture-contest
    name: 아트앤컬처 공모란
    url: https://www.art-culture.co.kr/magazine_contest
    cats: [art, residency]
    region: 전국
    filter: false
    link_regex: 'magazine_contest/\d+'

  - id: archivist-residency
    name: 아키비스트 레지던시
    url: https://archivist.kr/?d=biz&f=Residency&l=dbs
    cats: [residency]
    region: 전국
    filter: false

  - id: archivist-contest
    name: 아키비스트 공모
    url: https://archivist.kr/?d=biz&f=Contest&l=dbs
    cats: [art]
    region: 전국
    filter: true

  - id: artnuri
    name: 아트누리 (전국 문화재단 지원사업 모음)
    url: https://artnuri.or.kr/crawler/info/search.do?key=2301170002&sc_isDo=I&sc_isDo=T&recordCountPerPage=50&pageIndex=1
    cats: [art]
    region: 전국
    filter: true
    onclick:
      regex: "goView\\('([^']+)'\\s*,\\s*'([^']+)'\\s*,\\s*'([^']+)'\\)"
      template: "https://artnuri.or.kr/crawler/info/view.do?key=2301170002&docid={id}&source={id2}&seNo={id3}"

  - id: arthub-contest
    name: 아트허브 공모
    enabled: false   # robots.txt가 검색엔진 외 수집을 금지. 직접 추가(manual.yaml)로만 사용
    url: https://arthub.co.kr/sub04/board01_list.htm
    cats: [art, residency]
    region: 전국
    filter: false
    link_regex: 'sub04/board01_view\.htm\?No=\d+'

  # ── 예술·전시 지원 ───────────────────────────
  - id: arko-notice
    name: 한국문화예술위원회 공지
    url: https://www.arko.or.kr/board/list/4013?bid=463
    cats: [art]
    region: 전국
    filter: true
    link_regex: '(board/view/4013|artnuri\.or\.kr/crawler/info/view)'

  - id: gokams-event
    name: 예술경영지원센터 공모
    url: https://www.gokams.or.kr/01_news/event_list.aspx
    cats: [art]
    region: 전국
    filter: true
    link_regex: 'event_view\.aspx\?Idx=\d+'

  - id: mcst-culture-support
    name: 문화체육관광부 문화예술 지원사업
    url: https://www.mcst.go.kr/site/s_culture/cultureSp/cultureSpList.jsp
    cats: [art]
    region: 전국
    filter: true

  - id: sema-notice
    name: 서울시립미술관 공지
    enabled: false   # robots.txt가 수집을 막음
    url: https://sema.seoul.go.kr/kr/notice/notice/list
    cats: [art, residency]
    region: 서울
    filter: true

  # ── 디자인·공예 ──────────────────────────────
  - id: kidp-notice
    name: 한국디자인진흥원 공지
    url: https://kidp.or.kr/?menuno=1202
    cats: [design, startup]
    region: 전국
    filter: true
    onclick:
      regex: "submitForm\\(this,'view',(\\d+)\\)"
      template: "https://kidp.or.kr/?menuno=1202&bbsno={id}&siteno=16&act=view&ztag=rO0ABXQAMzxjYWxsIHR5cGU9ImJvYXJkIiBubz0iNjIyIiBza2luPSJraWRwX2JicyI%2BPC9jYWxsPg%3D%3D"
    link_regex: 'act=view'

  - id: seouldesign-notice
    name: 서울디자인재단 공지
    enabled: false   # 상세 글이 주소 없이 열리는 방식이라 수집 불가. DDP 공모는 공모전 모음 사이트로 들어옴
    url: https://www.seouldesign.or.kr/board/notice
    cats: [design, goods]
    region: 서울
    filter: true

  - id: scas
    name: 서울문화재단 지원사업 (SCAS)
    # 서울문화재단·신당창작아케이드·금천예술공장 등 서울 창작공간 공모가 모두 여기로 신청받음
    url: https://www.scas.kr/biz/list
    link_regex: '/biz/detail/\d+'
    cats: [art, residency, local]
    region: 서울
    filter: false

  - id: aac-open-calls
    name: Alliance of Artists Communities 오픈콜 (해외 레지던시)
    url: https://artistcommunities.org/directory/open-calls
    link_regex: '/directory/open-calls/[a-z0-9-]+$'
    cats: [residency, overseas]
    region: 해외
    filter: false

  - id: kocca-notice
    name: 한국콘텐츠진흥원 사업공고
    url: https://www.kocca.kr/kocca/pims/list.do?menuNo=204104
    cats: [startup, art]
    region: 전국
    filter: true
    post_like: true

  - id: kcdf-notice
    name: 공예디자인문화진흥원 사업공모
    url: https://www.kcdf.or.kr/brd/board/337/L/menu/284
    link_regex: 'board/337/L/menu/284\?brdType=R.*bbIdx=\d+'
    cats: [design, art]
    region: 전국
    filter: false

  # ── 창업 지원 ────────────────────────────────
  - id: kstartup-ongoing
    name: K-Startup 사업공고
    url: https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do
    cats: [startup]
    region: 전국
    filter: true
    onclick:
      regex: "go_view\\((\\d+)\\)"
      template: "https://www.k-startup.go.kr/web/contents/bizpbanc-ongoing.do?schM=view&pbancSn={id}"

  - id: bizinfo
    name: 기업마당 정부 지원사업 (API)
    # 키 신청: 기업마당 → 정책정보 개방(API) → 활용신청. 받은 키를 GitHub secret BIZINFO_API_KEY 로 등록
    url: https://www.bizinfo.go.kr/web/lay1/bbs/S1T122C128/AS/74/list.do
    api:
      env: BIZINFO_API_KEY
      url: "https://www.bizinfo.go.kr/uss/rss/bizinfoApi.do?crtfcKey={key}&dataType=json&searchCnt=200"
      title: [pblancNm, title]
      link: [pblancUrl, link]
      link_prefix: "https://www.bizinfo.go.kr"
    cats: [startup]
    region: 전국
    filter: true
    title_keywords: [디자인, 공예, 문화, 콘텐츠, 예술, 관광, 기념품, 굿즈, 캐릭터, 창업, 소상공인, 1인, 청년, 제조, 시제품,
                     3D, 메이커, 수출, 해외, 전시, 박람회, 판로, 브랜드, 크라우드]

  - id: sba-notice
    name: 서울경제진흥원 사업공고
    url: https://www.sba.seoul.kr/Pages/ContentsMenu/Company_Support.aspx?C=6FA70790-6677-EC11-80E8-9418827691E2
    cats: [startup]
    region: 서울
    filter: true

  # ── 지역 문화재단 (홍보를 거의 안 하는 곳) ─────────
  - id: bcf-notice
    name: 부천문화재단 공지
    url: https://www.bcf.or.kr/base/board/list?boardManagementNo=25&menuLevel=2&menuNo=86
    cats: [local, art]
    region: 경기
    filter: true
    link_regex: 'base/board/read\?boardManagementNo=25&boardNo=\d+'

  - id: gdfac-notice
    name: 강동문화재단 공지
    url: https://www.gdfac.or.kr/community/ko/notice
    cats: [local, art]
    region: 서울
    filter: true
    link_regex: 'community/ko/notice/\d+'

  # ── 관광기념품 ───────────────────────────────
  - id: touraz-announce
    name: 투어라즈 공고·공모
    url: https://touraz.kr/announcementList/pssrpList
    cats: [goods]
    region: 전국
    filter: true

  # ── 해외 ─────────────────────────────────────
  - id: designboom-competitions
    name: designboom competitions
    url: https://www.designboom.com/competitions/design/
    cats: [overseas, design]
    region: 해외
    filter: false
    link_regex: 'designboom\.com/competition/'

  # ── 생활 지원 (청년·주거) ────────────────────────
  # 주소는 GitHub에서 시험 수집으로 확인 중. 수집 상태 표에서 0건·실패가 나오면 고칩니다.
  - id: life-seoul-youth
    name: 서울 청년몽땅정보통 지원정보
    url: https://youth.seoul.go.kr/infoData/sprtInfo/list.do
    link_regex: 'sprtInfo/view\.do'
    board: life
    cats: [youth]
    region: 서울
    filter: false
    first_take: 20
    reread_since: 2026-11-02

  - id: life-sh
    name: SH 서울주택도시공사 공고
    url: https://www.i-sh.co.kr/main/lay2/program/S1T294C297/www/brd/m_247/list.do
    link_regex: 'brd/m_247/view\.do'
    board: life
    cats: [housing]
    region: 서울
    filter: false
    first_take: 20
    reread_since: 2026-11-02

  - id: life-youthcenter
    name: 온통청년 청년정책 (API)
    # 키 신청: 온통청년(youthcenter.go.kr) → 오픈API → 인증키 신청. 받은 키를 GitHub secret YOUTHCENTER_API_KEY 로 등록
    url: https://www.youthcenter.go.kr
    api:
      env: YOUTHCENTER_API_KEY
      url: "https://www.youthcenter.go.kr/go/ythip/getPlcy?apiKeyNm={key}&pageNum=1&pageSize=100&rtnType=json"
      title: [plcyNm, polyBizSjnm]
      link: [aplyUrlAddr, refUrlAddr1, refUrlAddr2]
      link_template: "https://www.youthcenter.go.kr/youthPolicy/ythPlcyTotalSearch/ythPlcyDetail/{plcyNo}"
      link_fields: [plcyNo]
    board: life
    cats: [youth]
    region: 전국
    filter: false

  - id: life-myhome
    name: 마이홈 공공주택 모집공고
    url: https://www.myhome.go.kr/hws/portal/sch/selectRsdtRcritNtcView.do
    board: life
    cats: [housing]
    region: 전국
    filter: true
    post_like: true
    title_keywords: [청년, 임대, 행복주택, 매입, 전세, 모집, 입주자]
