name: daily-radar

on:
  schedule:
    - cron: "50 21 * * *"   # 매일 06:50 KST (GitHub 사정으로 수십 분 늦어질 수 있음)
  workflow_dispatch:
    inputs:
      args:
        description: "추가 옵션 (예: --discover, --only bizinfo, --dry-run)"
        required: false
        default: ""
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # page-only updates (push) must not wait behind a 40-minute collection run
  group: radar-${{ github.event_name == 'push' && 'page' || 'collect' }}
  cancel-in-progress: false

jobs:
  collect:
    # 수집만 합니다 (예약·수동 실행). 저장소 변수 RUNNER=self-hosted 면 등록된 한국 실행기(Mac)에서 돕니다.
    if: github.event_name != 'push'
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # setup-python은 Mac에서 관리자 비밀번호(sudo)가 필요해 무인 실행이 멈춥니다.
      # uv는 비밀번호 없이 파이썬을 받아 가상환경을 만들고 PATH에 올려 줍니다 (Linux·Mac 공통).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          activate-environment: true

      - run: uv pip install -r requirements.txt

      - name: Headless browser (for boards drawn by JavaScript)
        if: github.event_name != 'push'
        run: python -m playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} chromium

      - name: Offline tests
        run: python -m pytest -q

      - name: Collect
        if: github.event_name != 'push'
        env:
          # 둘 중 하나만 있으면 됩니다. 구독 토큰이면 Claude 구독 사용량을, API 키면 종량제 요금을 씁니다.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_LIFE_PROFILE: ${{ secrets.RADAR_LIFE_PROFILE }}
          BIZINFO_API_KEY: ${{ secrets.BIZINFO_API_KEY }}
          YOUTHCENTER_API_KEY: ${{ secrets.YOUTHCENTER_API_KEY }}
          RUN_ARGS: ${{ github.event.inputs.args }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "AI: Claude API (종량제)"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            # 붙여넣을 때 섞인 줄바꿈·공백 제거
            export CLAUDE_CODE_OAUTH_TOKEN="$(printf %s "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
            echo "AI: Claude 구독 (Claude Code CLI)"
            npm install -g @anthropic-ai/claude-code >/dev/null
            claude --version
          else
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN 또는 ANTHROPIC_API_KEY secret이 필요합니다. README의 설정 방법을 보세요."
            exit 1
          fi
          # 실행 기록을 실행기 작업 폴더에도 남깁니다 (Mac이면 ~/actions-runner/_work/gongmo-radar/radar-logs, 최근 14개)
          LOGDIR="$GITHUB_WORKSPACE/../radar-logs"; mkdir -p "$LOGDIR"
          ls -t "$LOGDIR"/*.log 2>/dev/null | tail -n +14 | xargs rm -f 2>/dev/null || true
          set -o pipefail
          python -m radar.run $RUN_ARGS 2>&1 | tee "$LOGDIR/run-$(TZ=Asia/Seoul date '+%Y%m%d-%H%M').log"

      - name: Save data
        if: github.event_name != 'push'
        run: |
          git config user.name "gongmo-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push

  # 사이트 만들기·배포는 항상 GitHub 서버(리눅스)에서 합니다. Pages 업로드 도구가 Mac에는 없는 gtar를 쓰기 때문입니다.
  build:
    needs: collect
    if: ${{ !cancelled() && (needs.collect.result == 'success' || needs.collect.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 방금 수집기가 올린 데이터까지 포함한 최신 상태

      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'push'
        with:
          python-version: "3.12"
          activate-environment: true

      - name: Offline tests (page-only updates)
        if: github.event_name == 'push'
        run: uv pip install -r requirements.txt && python -m pytest -q

      - name: Build site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          cp -r data _site/data
          rm -f _site/data/seen.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
